<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Academic</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>Academic</h1>

      <section id="cookies-section">
        <label for="cookies-input">Cookie SIGAA</label>
        <textarea id="cookies-input" rows="3" placeholder="_ufg_br_sess=...; JSESSIONID=..."></textarea>
        <button id="btn-update">Atualizar dados</button>
        <p id="status"></p>
      </section>

      <section id="perfil" hidden>
        <h2 id="nome"></h2>
        <p id="curso"></p>
        <div id="indices"></div>
      </section>

      <section id="materias-section" hidden>
        <h2>Matérias</h2>
        <ul id="materias"></ul>
      </section>

      <section id="atividades-section" hidden>
        <h2>Atividades</h2>
        <ul id="atividades"></ul>
      </section>
    </main>
  </body>
</html>
