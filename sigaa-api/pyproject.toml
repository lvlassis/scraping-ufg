[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigaa-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sigaa-scraper>=0.2.0",
]

[tool.uv.sources]
sigaa-scraper = { git = "https://github.com/lvlassis/sigaa-scraper.git", tag = "0.2.0" }
